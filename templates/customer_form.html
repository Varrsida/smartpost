{% extends "base.html" %}

{% block title %}{{ action }} Customer – SmartPost{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <div style="margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between;">
        <div>
            <h1 style="font-size: 2rem; margin-bottom: 6px;">{{ action }} Customer Profile</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Enter customer identification and address details.</p>
        </div>
        <a href="{{ url_for('customers') }}" class="btn btn-secondary">← Back to List</a>
    </div>

    <div class="card" style="padding: 32px;">
        <form action="{% if customer %}{{ url_for('edit_customer', id=customer.id) }}{% else %}{{ url_for('add_customer') }}{% endif %}" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" name="full_name" class="form-control" placeholder="e.g. Alexander Wright" value="{{ customer.full_name if customer else '' }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Phone Number *</label>
                    <input type="text" name="phone" class="form-control" placeholder="e.g. +1 (555) 234-5678" value="{{ customer.phone if customer else '' }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <input type="email" name="email" class="form-control" placeholder="e.g. alex@example.com" value="{{ customer.email if customer else '' }}" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Street Address *</label>
                <input type="text" name="address" class="form-control" placeholder="e.g. 742 Evergreen Terrace" value="{{ customer.address if customer else '' }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">City *</label>
                    <input type="text" name="city" class="form-control" placeholder="e.g. Springfield" value="{{ customer.city if customer else '' }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">State / Region *</label>
                    <input type="text" name="state" class="form-control" placeholder="e.g. OR" value="{{ customer.state if customer else '' }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Postal Code *</label>
                    <input type="text" name="postal_code" class="form-control" placeholder="e.g. 97477" value="{{ customer.postal_code if customer else '' }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">ID Proof Type</label>
                    <select name="id_proof_type" class="form-select">
                        <option value="Driver License" {% if customer and customer.id_proof_type == 'Driver License' %}selected{% endif %}>Driver License</option>
                        <option value="National ID" {% if customer and customer.id_proof_type == 'National ID' %}selected{% endif %}>National ID</option>
                        <option value="Passport" {% if customer and customer.id_proof_type == 'Passport' %}selected{% endif %}>Passport</option>
                        <option value="Social Security / Tax ID" {% if customer and customer.id_proof_type == 'Social Security / Tax ID' %}selected{% endif %}>Social Security / Tax ID</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">ID Proof Number</label>
                    <input type="text" name="id_proof_number" class="form-control" placeholder="e.g. DL-98765432" value="{{ customer.id_proof_number if customer else '' }}">
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Customer Record</button>
                <a href="{{ url_for('customers') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
