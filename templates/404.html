{% extends "base.html" %}

{% block title %}404 Page Not Found – SmartPost{% endblock %}

{% block public_content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px;">
    <div style="max-width: 500px;">
        <div style="font-size: 5rem; font-weight: 800; font-family: var(--font-heading); color: var(--accent); margin-bottom: 0;">404</div>
        <h2 style="font-size: 1.8rem; margin-bottom: 12px;">Page Not Found</h2>
        <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 24px;">
            The requested postal route or tracking resource could not be found on the SmartPost server.
        </p>
        <a href="/" class="btn btn-primary">Return to Home Page</a>
    </div>
</div>
{% endblock %}
